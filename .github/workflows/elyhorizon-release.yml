name: Elyhorizon release

on:
  push:
    tags:
      - 'v*'
      - 'elyhorizon-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.2.1 or 0.2.1-beta.1'
        required: true
        type: string
      publish:
        description: Publish to GitHub Releases (otherwise build an Actions artifact only)
        type: boolean
        default: true
      publish_run:
        description: 'Publish what this run id already built instead of building: nothing is compiled and no platform job starts'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: elyhorizon-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.publish_run == ''
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      # Public Desktop registration, compiled into the EXE; never provide a client secret.
      HORIZON_ELY_CLIENT_ID: ${{ vars.HORIZON_ELY_CLIENT_ID }}
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_TELEMETRY_URL: 'off'
      HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
      HORIZON_NO_AUDIO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Version and isolated test homes
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $version = $env:GITHUB_REF_NAME -replace '^elyhorizon-v', '' -replace '^v', ''
          } else {
            $version = $env:INPUT_VERSION
          }
          $tag = "elyhorizon-v$version"
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw 'Expected a version such as 0.2.1 or 0.2.1-beta.1'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "HORIZON_LAUNCHER_VERSION=$version" >> $env:GITHUB_ENV
          "HORIZON_LAUNCHER_TAG=$tag" >> $env:GITHUB_ENV
          "HORIZON_VERSION=$version" >> $env:GITHUB_ENV
          $scratch = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
          foreach ($key in @('HORIZON_HOME', 'HORIZON_LAUNCHER_HOME', 'XDG_DATA_HOME',
            'XDG_CONFIG_HOME', 'HORIZON_LAUNCHER_TRASH', 'HORIZON_LAUNCHER_CLIPBOARD',
            'HORIZON_LAUNCHER_DESKTOP')) {
            $dir = Join-Path $scratch $key
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            "$key=$dir" >> $env:GITHUB_ENV
          }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test offline release validators
        run: python -m unittest tests.test_ely_oauth_release tests.test_launcher_package
      - name: Require a valid public Ely.by Desktop registration
        run: python tools/check_ely_oauth.py
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            launcher -> target
          shared-key: elyhorizon-windows-release
      - name: Check public files
        run: python tools/check_public_tree.py
      - name: Test launcher
        run: cargo test --manifest-path launcher/Cargo.toml --release --locked --lib --bins
      - name: Test game authentication
        run: cargo test --locked -p horizon-client-render --no-default-features --lib auth::tests
      - name: Build launcher
        run: cargo build --manifest-path launcher/Cargo.toml --release --locked --bin horizon-launcher
      - name: Build matching Horizon client
        # horizon-official is the game with Horizon's own in-game parts plugged in
        # (docs/layers.md); the launcher and players know it as horizon-client.
        run: |
          cargo build --release --locked -p horizon-official --bin horizon-official
          Copy-Item target/release/horizon-official.exe target/release/horizon-client.exe -Force
      - name: Build the shared wasm standard library
        # Wasm mods are members of one group linked at load, so the game needs the shared standard
        # library member beside its own executable (horizon-mod-wasm: `current_exe()`); a game
        # shipped without it refuses every wasm mod. Every release build ships it with the game
        # (.github/workflows/game-build.yml), so these packages do too. One pinned toolchain builds
        # it, installed here if the runner lacks it (cargo-horizon-mod/wasm.rs).
        run: |
          cargo run --locked -p cargo-horizon-mod -- wasm-std target/release/horizon-wasm-std.wasm
      - name: Check Windows runtime dependencies
        run: |
          python tools/check_imports.py launcher/target/release/horizon-launcher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_imports.py target/release/horizon-client.exe
      - name: Package launcher and client together
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $folder = 'dist/Elyhorizon'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item launcher/target/release/horizon-launcher.exe $folder
          Copy-Item target/release/horizon-client.exe $folder
          # The game loads the shared wasm standard library beside its own executable, and the run
          # holder opens the completion marker in the folder it starts the game from
          # (horizon-mod-package holder::lease_paths, horizon-mod-wasm): both travel beside the
          # game in every package. The marker is an empty file, never a link.
          Copy-Item target/release/horizon-wasm-std.wasm $folder
          New-Item -ItemType File -Path "$folder/.installed" -Force | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, docs/elyby-account.md $folder
          Copy-Item packaging/windows/elyhorizon-readme.txt "$folder/README.txt"
          $archive = "Elyhorizon-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path $folder -DestinationPath "dist/$archive"
          "### Windows x64 bundle: $archive" >> $env:GITHUB_STEP_SUMMARY
      - name: Build Elyhorizon installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 compiler is missing on this runner' }
          $payload = (Resolve-Path dist/Elyhorizon).Path
          $output = (Resolve-Path dist).Path
          $numeric = ($env:VERSION -split '-')[0] + '.0'
          & $compiler "/DAppVersion=$env:VERSION" "/DNumericVersion=$numeric" "/DPayloadDir=$payload" "/DBuildOutputDir=$output" packaging/windows/elyhorizon.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer and uninstaller
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installed = Join-Path $env:RUNNER_TEMP ('elyhorizon-install-' + [guid]::NewGuid().ToString('N'))
          $setup = (Resolve-Path "dist/Elyhorizon-$env:VERSION-windows-x64-setup.exe").Path
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/TASKS=', "/DIR=`"$installed`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          foreach ($name in @('horizon-launcher.exe', 'horizon-client.exe')) {
            $expected = (Get-FileHash "dist/Elyhorizon/$name" -Algorithm SHA256).Hash
            if ((Get-FileHash (Join-Path $installed $name) -Algorithm SHA256).Hash -ne $expected) {
              throw "Installer did not install the matching $name"
            }
          }
          # The installed EXE must work without the build job's environment or keychain.
          $expectedClientId = $env:HORIZON_ELY_CLIENT_ID
          Remove-Item Env:HORIZON_ELY_CLIENT_ID -ErrorAction SilentlyContinue
          Remove-Item Env:HORIZON_ELY_CLIENT_SECRET -ErrorAction SilentlyContinue
          Remove-Item Env:HORIZON_ELY_REDIRECT_URI -ErrorAction SilentlyContinue
          $env:HORIZON_LAUNCHER_HOME = Join-Path $env:RUNNER_TEMP ('elyhorizon-clean-' + [guid]::NewGuid().ToString('N'))
          $auth = & (Join-Path $installed 'horizon-launcher.exe') --json account ely-status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $auth.client_id -ne $expectedClientId -or $auth.bundled_client_id -ne $expectedClientId -or $auth.flow -ne 'authorization_code_pkce' -or $auth.client_secret_required -ne $false) {
            throw 'Installed launcher is missing its public PKCE configuration'
          }
          python tools/check_launcher_package.py --launcher (Join-Path $installed 'horizon-launcher.exe') --client (Join-Path $installed 'horizon-client.exe') --client-id $expectedClientId --require-completion-marker --require-wasm-std
          if ($LASTEXITCODE -ne 0) { throw 'Installed clean-home smoke test failed' }
          $process = Start-Process -FilePath (Join-Path $installed 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          foreach ($name in @('horizon-launcher.exe', 'horizon-client.exe')) {
            if (Test-Path (Join-Path $installed $name)) { throw "Uninstaller left $name behind" }
          }
      - name: Checksum release files
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.zip', '.exe') } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elyhorizon-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64
    if: github.event_name != 'workflow_dispatch' || inputs.publish_run == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HORIZON_ELY_CLIENT_ID: ${{ vars.HORIZON_ELY_CLIENT_ID }}
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_TELEMETRY_URL: 'off'
      HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
      HORIZON_NO_AUDIO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Version and isolated test homes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$INPUT_VERSION
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=${GITHUB_REF_NAME#elyhorizon-v}
            version=${version#v}
          fi
          tag=elyhorizon-v$version
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo '::error::Invalid release version'; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=$tag" >> "$GITHUB_ENV"
          echo "HORIZON_VERSION=$version" >> "$GITHUB_ENV"
          scratch=$(mktemp -d)
          for key in HORIZON_HOME HORIZON_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME HORIZON_LAUNCHER_TRASH HORIZON_LAUNCHER_CLIPBOARD HORIZON_LAUNCHER_DESKTOP; do
            mkdir -p "$scratch/$key"
            echo "$key=$scratch/$key" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test offline release validators
        run: python -m unittest tests.test_ely_oauth_release tests.test_launcher_package
      - name: Require a valid public Ely.by Desktop registration
        run: python tools/check_ely_oauth.py
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            launcher -> target
          shared-key: elyhorizon-linux-release
      - name: Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev libssl-dev pkg-config patchelf
      - name: Check public files
        run: python tools/check_public_tree.py
      - name: Test launcher
        run: cargo test --manifest-path launcher/Cargo.toml --release --locked --lib --bins
      - name: Build launcher and matching client
        run: |
          cargo build --manifest-path launcher/Cargo.toml --release --locked --bin horizon-launcher
          # horizon-official is the game with Horizon's own in-game parts plugged in
          # (docs/layers.md); the launcher and players know it as horizon-client.
          cargo build --release --locked -p horizon-official --bin horizon-official
          cp -f target/release/horizon-official target/release/horizon-client
          python tools/check_imports.py target/release/horizon-client
          # Wasm mods are members of one group linked at load, so the game needs the shared standard
          # library member beside its own executable (horizon-mod-wasm: `current_exe()`); a game
          # shipped without it refuses every wasm mod. Every release build ships it with the game
          # (.github/workflows/game-build.yml), so these packages do too.
          cargo run --locked -p cargo-horizon-mod -- wasm-std target/release/horizon-wasm-std.wasm
      - name: Package Linux archive and AppImage
        run: |
          set -euo pipefail
          folder=dist/Elyhorizon
          mkdir -p "$folder"
          install -m755 launcher/target/release/horizon-launcher target/release/horizon-client "$folder/"
          # The game loads the shared wasm standard library beside its own executable, and the run
          # holder opens the completion marker in the folder it starts the game from
          # (horizon-mod-package holder::lease_paths, horizon-mod-wasm): both travel beside the
          # game in every package. The marker is an empty file, never a link.
          install -m644 target/release/horizon-wasm-std.wasm "$folder/horizon-wasm-std.wasm"
          : > "$folder/.installed"
          cp LICENSE THIRD_PARTY_NOTICES.md docs/elyby-account.md "$folder/"
          cp packaging/linux/elyhorizon-readme.txt "$folder/README.txt"
          tar -C dist -czf "dist/Elyhorizon-$VERSION-linux-x86_64.tar.gz" Elyhorizon
          bash packaging/linux/appimage.sh launcher/target/release/horizon-launcher "$VERSION" dist target/release/horizon-client
      - name: Verify packaged Linux executables and embedded authentication
        run: |
          set -euo pipefail
          extracted=$(mktemp -d)
          tar -xzf "dist/Elyhorizon-$VERSION-linux-x86_64.tar.gz" -C "$extracted"
          for binary in horizon-launcher horizon-client; do
            cmp "dist/Elyhorizon/$binary" "$extracted/Elyhorizon/$binary"
          done
          "$extracted/Elyhorizon/horizon-launcher" --version
          "$extracted/Elyhorizon/horizon-client" --help > /dev/null
          image="$PWD/dist/Elyhorizon-$VERSION-linux-x86_64.AppImage"
          expected="$HORIZON_ELY_CLIENT_ID"
          unset HORIZON_ELY_CLIENT_ID HORIZON_ELY_CLIENT_SECRET HORIZON_ELY_REDIRECT_URI
          export HORIZON_LAUNCHER_HOME="$(mktemp -d)"
          "$extracted/Elyhorizon/horizon-launcher" --json account ely-status > archive-auth.json
          "$image" --appimage-extract-and-run --json account ely-status > appimage-auth.json
          for result in archive-auth.json appimage-auth.json; do
            jq -e --arg id "$expected" '.client_id == $id and .bundled_client_id == $id and .flow == "authorization_code_pkce" and .client_secret_required == false' "$result"
          done
          # Check that the AppImage really contains the matching client, beside the launcher.
          appdir=$(mktemp -d)
          (cd "$appdir" && "$image" --appimage-extract > /dev/null)
          "$appdir/squashfs-root/usr/bin/horizon-client" --help > /dev/null
          cp target/release/horizon-client "$extracted/patched-client"
          patchelf --set-rpath '$ORIGIN/../lib' "$extracted/patched-client"
          cmp "$extracted/patched-client" "$appdir/squashfs-root/usr/bin/horizon-client"
          python tools/check_launcher_package.py --launcher "$extracted/Elyhorizon/horizon-launcher" --client "$extracted/Elyhorizon/horizon-client" --client-id "$expected" --require-completion-marker --require-wasm-std
          python tools/check_launcher_package.py --launcher "$image" --appimage --client "$appdir/squashfs-root/usr/bin/horizon-client" --client-id "$expected" --require-completion-marker --require-wasm-std
      - name: Check AppImage startup on Arch Linux
        run: |
          set -euo pipefail
          export EXPECTED_CLIENT_ID="$HORIZON_ELY_CLIENT_ID"
          docker run --rm -v "$PWD/dist:/dist:ro" -e VERSION -e EXPECTED_CLIENT_ID archlinux:base bash -euc '
            pacman -Syu --noconfirm --needed alsa-lib systemd-libs dbus libglvnd vulkan-icd-loader jq
            scratch=$(mktemp -d)
            for key in HORIZON_HOME HORIZON_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME HORIZON_LAUNCHER_TRASH HORIZON_LAUNCHER_CLIPBOARD HORIZON_LAUNCHER_DESKTOP; do
              mkdir -p "$scratch/$key"
              export "$key=$scratch/$key"
            done
            export HORIZON_LAUNCHER_NO_SELF_UPDATE=1 HORIZON_NO_AUDIO=1
            image="/dist/Elyhorizon-$VERSION-linux-x86_64.AppImage"
            "$image" --appimage-extract-and-run --version
            "$image" --appimage-extract-and-run --json account ely-status > "$scratch/auth.json"
            jq -e --arg id "$EXPECTED_CLIENT_ID" ".bundled_client_id == \$id and .flow == \"authorization_code_pkce\" and .client_secret_required == false" "$scratch/auth.json"
            cd "$scratch"
            "$image" --appimage-extract > /dev/null
            ./squashfs-root/usr/bin/horizon-client --help > /dev/null
          '
      - name: Checksum Linux release files
        run: |
          cd dist
          sha256sum *.tar.gz *.AppImage > SHA256SUMS-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elyhorizon-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS-linux
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    if: github.event_name != 'workflow_dispatch' || inputs.publish_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
          - arch: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      HORIZON_ELY_CLIENT_ID: ${{ vars.HORIZON_ELY_CLIENT_ID }}
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      HORIZON_TELEMETRY_URL: 'off'
      HORIZON_LAUNCHER_NO_SELF_UPDATE: '1'
      HORIZON_NO_AUDIO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Version and isolated test homes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$INPUT_VERSION
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=${GITHUB_REF_NAME#elyhorizon-v}
            version=${version#v}
          fi
          tag=elyhorizon-v$version
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo '::error::Invalid release version'; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_VERSION=$version" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=$tag" >> "$GITHUB_ENV"
          echo "HORIZON_VERSION=$version" >> "$GITHUB_ENV"
          scratch=$(mktemp -d)
          for key in HORIZON_HOME HORIZON_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME HORIZON_LAUNCHER_TRASH HORIZON_LAUNCHER_CLIPBOARD HORIZON_LAUNCHER_DESKTOP; do
            mkdir -p "$scratch/$key"
            echo "$key=$scratch/$key" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test offline release validators
        run: python -m unittest tests.test_ely_oauth_release tests.test_launcher_package
      - name: Require a valid public Ely.by Desktop registration
        run: python tools/check_ely_oauth.py
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            launcher -> target
          shared-key: elyhorizon-macos-${{ matrix.arch }}
      - name: Ensure the Metal compiler
        run: |
          set -euo pipefail
          if xcrun --sdk macosx metal --version > /dev/null 2>&1; then
            xcrun --sdk macosx metal --version
            exit 0
          fi
          # Xcode 26 ships the Metal toolchain as a separate component. Newer runners may lack it.
          xcodebuild -help 2>&1 | grep -q -- '-downloadComponent' || {
            echo '::error::This Xcode has no Metal compiler and cannot download one; select a full Xcode with Metal support.'
            exit 1
          }
          sudo xcodebuild -downloadComponent MetalToolchain
          xcrun --sdk macosx --find metal
      - name: Test and build launcher with runtime Metal shaders
        run: |
          cargo test --manifest-path launcher/Cargo.toml --release --locked --features gpui_platform/runtime_shaders --lib --bins
          cargo build --manifest-path launcher/Cargo.toml --release --locked --features gpui_platform/runtime_shaders --bin horizon-launcher
          cargo build --release --locked -p horizon-official --bin horizon-official
          cp -f target/release/horizon-official target/release/horizon-client
          # No wasm standard library member in the app bundle: a sealed Contents/MacOS cannot carry
          # one, so the launcher stages the game into the version's own Horizon.app, which links the
          # member the version folder already has (game_app::ensure_game).
      - name: Require system-only dynamic libraries
        run: |
          for binary in launcher/target/release/horizon-launcher target/release/horizon-client; do
            others=$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -v -E '^(/usr/lib/|/System/Library/)' || true)
            [[ -z "$others" ]] || { echo "::error::$binary links non-system libraries: $others"; exit 1; }
          done
      - name: Package Elyhorizon app, ZIP and DMG
        run: bash packaging/macos/elyhorizon.sh launcher/target/release/horizon-launcher target/release/horizon-client "$VERSION" dist '${{ matrix.arch }}'
      - name: Verify mounted installer and embedded authentication
        run: |
          set -euo pipefail
          base="Elyhorizon-$VERSION-macos-${{ matrix.arch }}"
          extracted=$(mktemp -d)
          ditto -x -k "dist/$base.zip" "$extracted"
          codesign --verify --deep --strict "$extracted/Elyhorizon.app"
          mountpoint=$(mktemp -d)
          hdiutil attach "dist/$base.dmg" -mountpoint "$mountpoint" -nobrowse -readonly
          trap 'hdiutil detach "$mountpoint"' EXIT
          installed=$(mktemp -d)
          ditto "$mountpoint/Elyhorizon.app" "$installed/Elyhorizon.app"
          codesign --verify --deep --strict "$installed/Elyhorizon.app"
          for binary in horizon-launcher horizon-client; do
            cmp "$extracted/Elyhorizon.app/Contents/MacOS/$binary" "$installed/Elyhorizon.app/Contents/MacOS/$binary"
          done
          expected="$HORIZON_ELY_CLIENT_ID"
          unset HORIZON_ELY_CLIENT_ID HORIZON_ELY_CLIENT_SECRET HORIZON_ELY_REDIRECT_URI
          export HORIZON_LAUNCHER_HOME="$(mktemp -d)"
          "$installed/Elyhorizon.app/Contents/MacOS/horizon-launcher" --json account ely-status > macos-auth.json
          jq -e --arg id "$expected" '.client_id == $id and .bundled_client_id == $id and .flow == "authorization_code_pkce" and .client_secret_required == false' macos-auth.json
          "$installed/Elyhorizon.app/Contents/MacOS/horizon-client" --help > /dev/null
          # Neither the wasm standard library member nor the completion marker travels in this
          # bundle: a macOS app bundle's sealed Contents/MacOS can carry only the two programs,
          # because a file there that is not code keeps its signature in an extended attribute
          # the ZIP does not carry (packaging/macos/elyhorizon.sh). The launcher stages the
          # shipped game into the version's own Horizon.app and the version folder carries the
          # marker the run holder opens, so neither is required here.
          python tools/check_launcher_package.py --launcher "$installed/Elyhorizon.app/Contents/MacOS/horizon-launcher" --client "$installed/Elyhorizon.app/Contents/MacOS/horizon-client" --client-id "$expected"
      - name: Checksum macOS release files
        run: |
          cd dist
          shasum -a 256 *.zip *.dmg > SHA256SUMS-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elyhorizon-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS-macos-*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build, linux, macos]
    if: (github.event_name == 'push' || inputs.publish) && (github.event_name != 'workflow_dispatch' || inputs.publish_run == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: elyhorizon-*
          merge-multiple: true
          path: dist
      - name: Combine platform checksums
        run: |
          set -euo pipefail
          : > dist/SHA256SUMS.txt
          for sums in dist/SHA256SUMS-*; do
            [[ -f "$sums" ]] || continue
            sed 's/\r$//' "$sums" >> dist/SHA256SUMS.txt
            rm "$sums"
          done
          test -s dist/SHA256SUMS.txt
          sort -k2 dist/SHA256SUMS.txt -o dist/SHA256SUMS.txt
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Create or verify the release tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const sha = process.env.COMMIT;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: tag });
            if (commit.data.sha !== sha) {
              throw new Error('The release tag points to another commit; choose a new version.');
            }
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; choose a new version."
            exit 1
          fi
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Elyhorizon ${{ needs.build.outputs.version }}
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.dmg
            dist/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          make_latest: 'false'
          fail_on_unmatched_files: true
          body: |
            **Windows x64:** run the `windows-x64-setup.exe` installer, or extract the portable ZIP and keep both executables together.
            **Linux x86_64:** make the AppImage executable and run it, or extract the tar.gz.
            **macOS:** choose `arm64` for Apple Silicon or `x64` for Intel; open the DMG and drag Elyhorizon into Applications.
            The app is ad hoc signed, not Apple-notarized. If macOS blocks it, run `xattr -cr /Applications/Elyhorizon.app` and open it again.

            Includes the matching Horizon client with Ely.by account and skin support.
            Browser sign-in uses public Desktop OAuth with S256 PKCE; no client secret is included or required.
            `SHA256SUMS.txt` lists every artifact. Minecraft game files are downloaded or prepared at runtime.

  # Publish what an earlier run already built: `-f publish_run=<run id>`. Nothing is
  # compiled and no platform job starts. For a run whose platform jobs were cancelled at
  # `timeout-minutes` before its release job could run, and for a release that is wanted
  # on the platforms that did finish.
  #
  # The tag is written with this run's token, and events from that token start no
  # workflow, so the `push: tags` trigger above does not rebuild what is being published.
  publish-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      RUN_ID: ${{ inputs.publish_run }}
      VERSION: ${{ inputs.version }}
      TAG: elyhorizon-v${{ inputs.version }}
    steps:
      - name: Download the built run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          artifacts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          test -n "$artifacts"
          for name in $artifacts; do
            echo "::group::$name"
            gh run download "$RUN_ID" --name "$name" --dir dist
            echo "::endgroup::"
          done
          # Named for the version it built, or the release would carry another version's files.
          compgen -G "dist/Elyhorizon-$VERSION-*" > /dev/null || {
            echo "::error::Run $RUN_ID carries no Elyhorizon-$VERSION-* file; pass the version it built."
            exit 1
          }
          ls -l dist
      - name: Combine platform checksums
        run: |
          set -euo pipefail
          : > dist/SHA256SUMS.txt
          for sums in dist/SHA256SUMS-*; do
            [[ -f "$sums" ]] || continue
            sed 's/\r$//' "$sums" >> dist/SHA256SUMS.txt
            rm "$sums"
          done
          test -s dist/SHA256SUMS.txt
          sort -k2 dist/SHA256SUMS.txt -o dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt
      - name: Write the release notes its platforms deserve
        run: |
          set -euo pipefail
          seen=" "
          platforms=""
          notes=()
          note() {
            case "$seen" in *" $1 "*) return 0 ;; esac
            seen="$seen$1 "
            platforms="${platforms:+$platforms, }$1"
            notes+=("$2")
          }
          for file in dist/*; do
            case "$file" in
              *windows-x64*) note 'Windows x64' '**Windows x64:** run the `windows-x64-setup.exe` installer, or extract the portable ZIP and keep both executables together.' ;;
              *linux-x86_64*) note 'Linux x86_64' '**Linux x86_64:** make the AppImage executable and run it, or extract the tar.gz.' ;;
              *macos-arm64*) note 'macOS arm64' '**macOS arm64 (Apple Silicon):** open the DMG and drag Elyhorizon into Applications. The app is ad hoc signed, not Apple-notarized: if macOS blocks it, run `xattr -cr /Applications/Elyhorizon.app` and open it again.' ;;
              *macos-x64*) note 'macOS x64' '**macOS x64 (Intel):** open the DMG and drag Elyhorizon into Applications. The app is ad hoc signed, not Apple-notarized: if macOS blocks it, run `xattr -cr /Applications/Elyhorizon.app` and open it again.' ;;
            esac
          done
          test -n "$platforms"
          {
            printf '%s\n' "${notes[@]}"
            printf '\nPublished from the artifacts run %s had already built, without rebuilding: a platform\n' "$RUN_ID"
            printf 'that run did not finish is not in this release.\n\n'
            printf 'Includes the matching Horizon client with Ely.by account and skin support.\n'
            printf 'Browser sign-in uses public Desktop OAuth with S256 PKCE; no client secret is included or required.\n'
            printf '`SHA256SUMS.txt` lists every artifact. Minecraft game files are downloaded or prepared at runtime.\n'
          } > release-body.md
          echo "this release carries: $platforms"
          cat release-body.md
      - name: Create or verify the release tag
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.TAG;
            const run = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(process.env.RUN_ID),
            });
            const built = run.data.head_sha;
            // The workflow token carries contents: write, but can never carry the workflow scope
            // (it is not a permission a workflow token can be granted), and GitHub refuses a ref at
            // a commit whose change includes a file under .github/workflows without it, with
            // "Resource not accessible by integration". The tip this run is dispatched from is the
            // other candidate, and it must contain the built commit, or the release would name
            // sources that are not the binaries beside it.
            const candidates = [built, context.sha];
            const contains = async (sha) => {
              if (sha === built) return true;
              const { data } = await github.rest.repos.compareCommits({ owner, repo, base: built, head: sha });
              return data.status === 'ahead' || data.status === 'identical';
            };
            const taggedCommit = async () => {
              try {
                return (await github.rest.repos.getCommit({ owner, repo, ref: tag })).data.sha;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            if (process.env.PUBLISH !== 'true') {
              core.info(`dry run: ${tag} would be written at ${built}, or at this run's tip when that cannot carry it`);
              return;
            }
            let chosen = await taggedCommit();
            if (chosen) {
              if (!(await contains(chosen))) {
                throw new Error(`The tag ${tag} points at ${chosen}, which does not contain the built ${built}; choose a new version.`);
              }
              core.info(`${tag} already points at ${chosen}`);
            }
            let lastError = null;
            for (const sha of candidates) {
              if (chosen) break;
              if (!sha) continue;
              if (!(await contains(sha))) {
                core.warning(`${sha} does not contain the built ${built}; not tagging it`);
                continue;
              }
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
                chosen = sha;
                core.info(`wrote ${tag} at ${sha}`);
              } catch (error) {
                lastError = error;
                core.warning(`could not write ${tag} at ${sha}: ${error.message}`);
              }
            }
            if (!chosen) {
              throw lastError ?? new Error(`Neither ${built} nor this run's tip could carry ${tag}.`);
            }
            if (chosen !== built) {
              core.notice(`${tag} names ${chosen}, this run's tip, which contains the built ${built}: the workflow token cannot tag a commit that changes a workflow file.`);
              fs.appendFileSync(`${process.env.GITHUB_WORKSPACE}/release-body.md`,
                `\nThe tag names the commit this was published from, \`${chosen}\`, which contains the built\n` +
                `commit \`${built}\`: the workflow's own token cannot create a tag at a commit that\n` +
                `changes a workflow file.\n`);
            }
      - name: Refuse to overwrite an existing release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; choose a new version."
            exit 1
          fi
      - name: Publish release
        if: inputs.publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: elyhorizon-v${{ inputs.version }}
          name: Elyhorizon ${{ inputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.version, '-') }}
          make_latest: 'false'
          fail_on_unmatched_files: true
          body_path: release-body.md
